name: Repair verified key UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.tsx')
          s = p.read_text()
          original = s

          if 'pendingKey' not in s:
              s = s.replace(
                  "const [result, setResult] = useState(''); const [busy, setBusy] = useState(false); const [status, setStatus] = useState('Ready'); const [error, setError] = useState(''); const [showKeys, setShowKeys] = useState(false);",
                  "const [result, setResult] = useState(''); const [busy, setBusy] = useState(false); const [status, setStatus] = useState('Ready'); const [error, setError] = useState(''); const [showKeys, setShowKeys] = useState(false); const [pendingKey, setPendingKey] = useState<KeyEntry | null>(null);",
                  1,
              )

          s = s.replace("setDraftHealth(null); }, [provider]);", "setDraftHealth(null); setPendingKey(null); setError(''); }, [provider]);", 1)

          pattern = re.compile(r"  async function addKey\(\) \{.*?\n  \}\n  async function testSavedKey", re.S)
          replacement = '''  async function checkKey() {
    const secret = keyValue.trim();
    const endpoint = baseUrl.trim().replace(/\\/$/, '');
    if (!secret) { setError('API key required.'); return; }
    if (!model.trim()) { setError('Model is required for health check.'); return; }
    if (!endpoint) { setError('Base URL is required for health check.'); return; }
    if (!endpoint.toLowerCase().startsWith('https://')) { setError('Base URL must use HTTPS.'); return; }
    if (provider === 'custom' && endpoint.includes('your-endpoint.example')) { setError('Enter your real custom endpoint before checking.'); return; }
    setError(''); setDraftHealth(null); setPendingKey(null); setStatus('Checking provider, endpoint, API key & model…'); setTestingId('draft');
    const draft: KeyEntry = { id: uid(), provider, label: keyLabel.trim() || 'Key', key: secret, model: model.trim(), baseUrl: endpoint, enabled: true, priority: keys.length + 1, failures: 0, health: 'checking' as const };
    try {
      const health = await runHealthCheck(draft);
      const verified: KeyEntry = { ...draft, health: 'valid', lastStatus: 'Verified: authentication + endpoint + selected model' };
      setDraftHealth(health); setPendingKey(verified); setStatus('All checks passed — ready to save');
    } catch (e) {
      const message = e instanceof Error ? e.message : 'Key health check failed.';
      const health = (e as Error & { health?: HealthResponse }).health;
      setDraftHealth(health || { ok: false, message }); setPendingKey(null); setStatus('Key rejected — nothing was saved'); setError(message);
    } finally { setTestingId(null); }
  }
  function saveVerifiedKey() {
    if (!pendingKey || draftHealth?.ok !== true || draftHealth?.modelAvailable === false) return;
    setKeys((x) => [...x, { ...pendingKey, id: uid(), priority: x.length + 1 }]);
    setKeyValue(''); setPendingKey(null); setDraftHealth(null); setStatus('Verified key saved'); setError('');
  }
  async function testSavedKey'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1 and 'async function checkKey()' not in s:
              raise SystemExit('Could not replace addKey function')

          s = s.replace('onClick={addKey}', 'onClick={pendingKey ? saveVerifiedKey : checkKey}', 1)
          s = s.replace("{testingId === 'draft' ? 'Checking…' : 'Check key & add'}", "{testingId === 'draft' ? 'Checking…' : pendingKey ? 'Save verified key' : 'Check API key'}", 1)

          marker = '<button type="button" onClick={pendingKey ? saveVerifiedKey : checkKey}'
          if 'Verification result' not in s and marker in s:
              block = '''{draftHealth && (
            <div className={`mt-3 rounded-xl border p-3 text-sm ${draftHealth.ok && draftHealth.modelAvailable !== false ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-red-500/30 bg-red-500/5'}`}>
              <div className="font-semibold">Verification result</div>
              <div className="mt-2 grid grid-cols-2 gap-2 text-xs opacity-80">
                <span>Authentication: {draftHealth.ok ? '✓ passed' : '✕ failed'}</span>
                <span>Endpoint: {draftHealth.ok ? '✓ reachable' : '✕ failed'}</span>
                <span>Model: {draftHealth.modelAvailable === false ? '✕ unavailable' : draftHealth.ok ? '✓ available' : '✕ not verified'}</span>
                <span>Save state: {pendingKey ? '✓ ready' : '✕ blocked'}</span>
              </div>
              {pendingKey && <div className="mt-2 font-medium text-emerald-300">All checks passed. Review the details, then save this verified key.</div>}
            </div>
          )}
          '''
              s = s.replace(marker, block + marker, 1)

          if s == original:
              print('No changes needed; UI repair already present.')
          else:
              p.write_text(s)
              print('UI repair applied.')
          PY

      - name: Quality gate
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run typecheck
          npm run build

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: two-step verified API key save flow'
          git push
