name: Repair PRD Forge page types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair key typing
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          s2 = s.replace('baseUrl?: string;', 'baseUrl: string;')
          s2 = s2.replace("const draft = { provider, label: keyLabel.trim() || 'Key'", "const draft: KeyEntry = { id: uid(), provider, label: keyLabel.trim() || 'Key'")
          s2 = s2.replace("defaultModel: 'gemini-3.7-flash'", "defaultModel: 'gemini-2.5-flash'")
          if s2 == s:
              raise SystemExit('No repair changes were necessary')
          p.write_text(s2)
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git rm .github/workflows/repair-page-types.yml
          git commit -m "fix: repair API key health typecheck"
          git push
