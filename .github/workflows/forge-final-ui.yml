name: Final Forge UI repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch verified-key flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.tsx')
          s = p.read_text()

          old_state = "const [result, setResult] = useState(''); const [busy, setBusy] = useState(false); const [status, setStatus] = useState('Ready'); const [error, setError] = useState(''); const [showKeys, setShowKeys] = useState(false);"
          new_state = "const [result, setResult] = useState(''); const [busy, setBusy] = useState(false); const [status, setStatus] = useState('Ready'); const [error, setError] = useState(''); const [showKeys, setShowKeys] = useState(false); const [pendingKey, setPendingKey] = useState<KeyEntry | null>(null);"
          if old_state in s and 'pendingKey' not in s:
              s = s.replace(old_state, new_state, 1)

          s = s.replace("setDraftHealth(null); }, [provider]);", "setDraftHealth(null); setPendingKey(null); setError(''); }, [provider]);", 1)

          pattern = re.compile(r"  async function addKey\(\) \{.*?\n  \}\n  async function testSavedKey", re.S)
          replacement = r'''  async function checkKey() {
    const secret = keyValue.trim();
    if (!secret) { setError('API key required.'); return; }
    if (!model.trim()) { setError('Model is required for health check.'); return; }
    if (!baseUrl.trim()) { setError('Base URL is required for health check.'); return; }
    if (!/^https:\\/\\//i.test(baseUrl.trim())) { setError('Base URL must use HTTPS.'); return; }
    if (provider === 'custom' && baseUrl.includes('your-endpoint.example')) { setError('Enter your real custom endpoint before checking.'); return; }
    setError(''); setDraftHealth(null); setPendingKey(null); setStatus('Checking provider, endpoint, API key & model…'); setTestingId('draft');
    const draft: KeyEntry = { id: uid(), provider, label: keyLabel.trim() || 'Key', key: secret, model: model.trim(), baseUrl: baseUrl.trim().replace(/\\/$/, ''), enabled: true, priority: keys.length + 1, failures: 0, health: 'checking' as const };
    try {
      const health = await runHealthCheck(draft);
      const verified: KeyEntry = { ...draft, health: 'valid', lastStatus: 'Verified: authentication + endpoint + selected model' };
      setDraftHealth(health);
      setPendingKey(verified);
      setStatus('All checks passed — ready to save');
    } catch (e) {
      const message = e instanceof Error ? e.message : 'Key health check failed.';
      const health = (e as Error & { health?: HealthResponse }).health;
      setDraftHealth(health || { ok: false, message });
      setPendingKey(null);
      setStatus('Key rejected — nothing was saved');
      setError(message);
    } finally { setTestingId(null); }
  }
  function saveVerifiedKey() {
    if (!pendingKey || draftHealth?.ok !== true || draftHealth?.modelAvailable === false) return;
    setKeys((x) => [...x, { ...pendingKey, id: uid(), priority: x.length + 1 }]);
    setKeyValue(''); setPendingKey(null); setDraftHealth(null); setStatus('Verified key saved'); setError('');
  }
  async function testSavedKey'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('addKey function pattern not found')
          s = s2

          # Replace the draft action button without depending on exact styling.
          old = "onClick={addKey}"
          if old not in s:
              raise SystemExit('addKey button handler not found')
          s = s.replace(old, "onClick={pendingKey ? saveVerifiedKey : checkKey}", 1)
          s = s.replace("{testingId === 'draft' ? 'Checking…' : 'Check key & add'}", "{testingId === 'draft' ? 'Checking…' : pendingKey ? 'Save verified key' : 'Check API key'}", 1)

          # Insert an explicit verification status block immediately before the draft action button.
          marker = "<button type=\"button\" onClick={pendingKey ? saveVerifiedKey : checkKey}"
          status_block = '''{draftHealth && (
            <div className={`mt-3 rounded-xl border p-3 text-sm ${draftHealth.ok && draftHealth.modelAvailable !== false ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-red-500/30 bg-red-500/5'}`}>
              <div className="font-semibold">Verification result</div>
              <div className="mt-2 grid grid-cols-2 gap-2 text-xs opacity-80">
                <span>Authentication: {draftHealth.ok ? '✓ passed' : '✕ failed'}</span>
                <span>Endpoint: {draftHealth.ok ? '✓ reachable' : '✕ failed'}</span>
                <span>Model: {draftHealth.modelAvailable === false ? '✕ unavailable' : draftHealth.ok ? '✓ available' : '✕ not verified'}</span>
                <span>Save state: {pendingKey ? '✓ ready' : '✕ blocked'}</span>
              </div>
              {pendingKey && <div className="mt-2 font-medium text-emerald-300">All checks passed. Review the details, then save this verified key.</div>}
            </div>
          )}
          '''
          if 'Verification result' not in s:
              s = s.replace(marker, status_block + marker, 1)

          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm install --no-audit --no-fund --package-lock=false
          npm run typecheck
          npm run build
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'fix: two-step verified API key save flow' || true
          git push
          git rm .github/workflows/forge-final-ui.yml
          git commit -m 'chore: remove one-time UI repair workflow'
          git push
