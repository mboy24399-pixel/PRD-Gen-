name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Build application
        env:
          GITHUB_ACTIONS: false
          VERCEL: 1
        run: npm run build
      - name: Smoke-test production page
        env:
          GITHUB_ACTIONS: false
          VERCEL: 1
        run: |
          npm run start -- -p 3000 > /tmp/prd-forge-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl -fsSL http://127.0.0.1:3000/ > /tmp/prd-forge-home.html; then break; fi
            sleep 1
          done
          test -s /tmp/prd-forge-home.html
          grep -q 'PRD Forge' /tmp/prd-forge-home.html
